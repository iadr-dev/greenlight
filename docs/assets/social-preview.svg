<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>greenlight: AI × BDD spec-driven development for Claude Code</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f2e"/>
      <stop offset="1" stop-color="#0f1219"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4cc36d" stop-opacity=".42"/>
      <stop offset=".6" stop-color="#4cc36d" stop-opacity=".1"/>
      <stop offset="1" stop-color="#4cc36d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232a3d"/>
      <stop offset="1" stop-color="#13161e"/>
    </linearGradient>
    <radialGradient id="green" cx="36%" cy="30%" r="80%">
      <stop offset="0" stop-color="#a6f2bb"/>
      <stop offset=".42" stop-color="#4cc36d"/>
      <stop offset="1" stop-color="#2a8f4a"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="226" cy="430" r="330" fill="url(#glow)"/>

  <!-- the logo, large -->
  <g transform="translate(96 150) scale(2.5)">
    <rect width="128" height="128" rx="30" fill="url(#body)"/>
    <rect x=".75" y=".75" width="126.5" height="126.5" rx="29.25" fill="none" stroke="#2b3140" stroke-width="1.5"/>
    <circle cx="64" cy="30" r="15.5" fill="#0d0f15"/><circle cx="64" cy="30" r="12" fill="#ff6b6b" fill-opacity=".22"/>
    <circle cx="64" cy="64" r="15.5" fill="#0d0f15"/><circle cx="64" cy="64" r="12" fill="#e3b341" fill-opacity=".22"/>
    <circle cx="64" cy="98" r="15.5" fill="#0d0f15"/><circle cx="64" cy="98" r="13.5" fill="url(#green)"/>
    <ellipse cx="58.5" cy="91.5" rx="5" ry="3" fill="#fff" fill-opacity=".3"/>
    <path d="M57 98.5l5.2 5.2 9.6-10.6" fill="none" stroke="#0b1d12" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the words -->
  <text x="470" y="262" font-size="118" font-weight="700" fill="#e6e9f0" letter-spacing="-3">greenlight</text>
  <text x="474" y="326" font-size="38" font-weight="600" fill="#e6e9f0">AI × BDD spec-driven development</text>
  <text x="474" y="372" font-size="38" font-weight="600" fill="#9aa4b8">for Claude Code</text>

  <!-- the flow: two steps are yours, then red, then green -->
  <g font-family="Consolas, 'SF Mono', Menlo, monospace" font-size="27" font-weight="700">
    <rect x="474" y="430" width="196" height="60" rx="30" fill="#4cc36d" fill-opacity=".14" stroke="#4cc36d" stroke-opacity=".6" stroke-width="2"/>
    <text x="572" y="469" text-anchor="middle" fill="#4cc36d">you approve</text>
    <path d="M682 460h30m-9-8l9 8-9 8" fill="none" stroke="#9aa4b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="724" y="430" width="116" height="60" rx="30" fill="#ff6b6b" fill-opacity=".14" stroke="#ff6b6b" stroke-opacity=".6" stroke-width="2"/>
    <text x="782" y="469" text-anchor="middle" fill="#ff6b6b">red</text>
    <path d="M852 460h30m-9-8l9 8-9 8" fill="none" stroke="#9aa4b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="894" y="430" width="130" height="60" rx="30" fill="#4cc36d" fill-opacity=".14" stroke="#4cc36d" stroke-opacity=".6" stroke-width="2"/>
    <text x="959" y="469" text-anchor="middle" fill="#4cc36d">green</text>
    <path d="M1036 460h30m-9-8l9 8-9 8" fill="none" stroke="#9aa4b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1078" y="430" width="156" height="60" rx="30" fill="#6ea8ff" fill-opacity=".14" stroke="#6ea8ff" stroke-opacity=".6" stroke-width="2"/>
    <text x="1156" y="469" text-anchor="middle" fill="#6ea8ff">evidence</text>
  </g>
  <text x="474" y="548" font-size="30" fill="#9aa4b8">Approve the contract. The AI does the rest.</text>
</svg>
