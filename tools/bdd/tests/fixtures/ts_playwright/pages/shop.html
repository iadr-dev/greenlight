<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><title>Shop</title></head>
  <body>
    <p data-testid="result">waiting</p>
    <script type="module">
      const result = document.querySelector('[data-testid="result"]');
      try {
        const response = await fetch('https://payments.test/v1/charges', { method: 'POST', body: JSON.stringify({ amount: 5 }) });
        result.textContent = (await response.json()).status;
      } catch {
        result.textContent = 'error';
      }
    </script>
  </body>
</html>
