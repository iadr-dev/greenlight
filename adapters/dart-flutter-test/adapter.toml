name = "dart-flutter-test"
version = 1
profiles = ["base", "ui", "lib"]            # every instruction of these profiles is bound in tests/steps/core_steps.dart

[detect]                                      # `init` suggests this adapter when a file matches and contains a word
files = ["pubspec.yaml"]
contains = ["flutter"]

[requires]
packages = ["flutter_test", "cucumber_gherkin", "cucumber_messages"]   # pinned in tests/pubspec.yaml, hashed in tests/pubspec.lock
optional = []

[paths]
features = "tests/features"
steps = "tests/steps"
drivers = "tests/drivers"
support = ["tests/bdd_test.dart", "tests/run_flutter.py", "tests/pubspec.yaml", "tests/pubspec.lock", "tests/analysis_options.yaml"]

[run]
# One bound script, tests/run_flutter.py, runs `flutter test --no-pub` in tests/ (the test code is a package of its own, so
# it never changes your application's pubspec) and turns Flutter's JSON event stream into the one JUnit report. The tag,
# the seed and the scenario reach the test through the environment, not the command line. Variables that change what Dart
# runs or how Flutter tests run (DART_*, FLUTTER_TEST*) are not passed on.
by_tag = '{python} -I tests/run_flutter.py --tag {tag}'
scrub_env = ["DART_", "FLUTTER_TEST", "FLUTTER_ENGINE", "FLUTTER_STORAGE_BASE_URL", "FLUTTER_GIT_URL"]
report = '--out {out}'
shuffle = '--seed {seed}'
isolated = '--scenario "{scenario}"'
timeout = 900

[classify]                                    # ordered; defects first; applied to the failure text
test_defect = [
  'NotMapped',
  'StepError|Undefined step|Ambiguous step',
  'UnstubbedCall|OutboundNetworkBlocked',
  'NoSuchMethodError|LateInitializationError|type .* is not a subtype',
  'FormatException: .*cannot be read',
]
expected_fail = [
  'BDD_EXPECTED_MISSING',
  'TestFailure',
  '(?s)Expected:.*Actual:',
]

# Quality checks are opt-in and are not copied into .bdd/config.toml: see "Quality checks" in guide.md for the
# [adapters.quality.NAME] tables (flutter analyze, dart format) to add to your own configuration.

[scan]                                        # used by `bdd scan`
step_start = '^\s*(?P<kind>given|when|then)\('
assert_patterns = ['\bassert\w*\(', '\bexpect\(', 'TestFailure']
sleep_patterns = ['Future\.delayed\(', '\bsleep\(']
stub_patterns = ['\.respond\(\s*[^\w.]([\w.]+)']
