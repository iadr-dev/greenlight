name = "dotnet-reqnroll"
version = 1
profiles = ["base", "api", "cli", "lib", "data"]   # every instruction of these profiles is bound in tests/steps/CoreSteps.cs

[detect]                                      # `init` suggests this adapter when a file matches and contains a word
files = ["*.csproj", "*.sln", "*.slnx", "global.json"]
contains = ["Sdk", "Project", "sdk"]

[requires]
packages = ["Reqnroll.xUnit 3.3.4", "xunit 2.9.3", "JunitXml.TestLogger 8.0.0"]   # pinned in tests/GreenlightTests.csproj and tests/packages.lock.json
optional = []

[paths]
features = "tests/features"
steps = "tests/steps"
drivers = "tests/drivers"
support = ["tests/GreenlightTests.csproj", "tests/packages.lock.json", "tests/nuget.config", "tests/.editorconfig", "tests/run_dotnet.py"]

[run]
# tests/run_dotnet.py (bound, standard library only) starts `dotnet test` on tests/GreenlightTests.csproj with the package
# restore locked to packages.lock.json, selects the scenarios of the feature by their tag (Reqnroll makes every tag an xUnit
# trait named Category) and, when isolated, by the scenario's name, and has the JunitXml.TestLogger write the report. A
# seed shuffles the scenarios through an orderer that reads GREENLIGHT_BDD_SEED. The words that change what .NET loads or
# how the test host behaves are not passed on; DOTNET_ROOT, PATH and NUGET_* are.
by_tag = '{python} -I tests/run_dotnet.py --tag {tag}'
scrub_env = ["DOTNET_STARTUP_HOOKS", "DOTNET_ADDITIONAL_DEPS", "DOTNET_SHARED_STORE", "DOTNET_ROLL_FORWARD", "DOTNET_gc", "COMPlus_", "MSBUILD", "VSTEST_", "XUNIT_"]
report = '--out {out}'
shuffle = '--seed {seed}'
isolated = '--scenario "{scenario}"'
timeout = 1200

[classify]                                    # ordered; defects first; applied to the failure text (type, message, body)
test_defect = [
  'NotMapped',
  'Parameter count mismatch|BindingException|Ambiguous step definitions|AmbiguousBindingException',
  'No matching step definition|Test pending|PendingStepException',
  'UnstubbedCall|OutboundNetworkBlocked',
  'error CS\d+|Build FAILED',
]
expected_fail = [
  'BDD_EXPECTED_MISSING',
  'AssertionError',
  'status (404|405|501)',
]

# Quality checks are opt-in and are not copied into .bdd/config.toml: see "Quality checks" in guide.md for the
# [adapters.quality.NAME] tables (dotnet format, analyzers with warnings as errors) to add to your own configuration.

[scan]                                        # used by `bdd scan`
step_start = '^\s*\[(?P<kind>Given|When|Then)\('
assert_patterns = ['\bAssert\w*\(', 'Should\w*\(']
sleep_patterns = ['Thread\.Sleep\(', 'Task\.Delay\(']
stub_patterns = ['\.Respond\(\s*[^\w.]([\w.]+)']
