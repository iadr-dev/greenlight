# greenlight gates for any stack whose runner writes a JUnit report (generic-junit), as a GitHub Actions workflow.
# Copy to .github/workflows/greenlight.yml and add your runner's toolchain where marked. Every action is pinned to a
# commit; update them on purpose, not by accident.
#
# `bdd run` uses the run command from .bdd/config.toml, so the runner is configured once. Per finished feature the job
# checks what a session cannot be trusted to: the approvals in the committed record, the locks, a fresh run that is
# green, the traceability, and (when the project asks for them) stability, quality and mutation.
name: greenlight

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GREENLIGHT_REF: v1.1.1          # a release tag of https://github.com/iadr-dev/greenlight

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # the mutation check compares with the commit at which the red was proven
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"     # runs the bdd command line, and the sample runner of the adapter
      # Add your runner's toolchain here, pinned the same way: setup-java, setup-node, setup-go or setup-dotnet,
      # then the step that installs the project's dependencies. If the runner is missing `bdd run` stops with
      # "not on PATH" before any scenario runs.
      - name: Get greenlight
        run: git clone --depth 1 --branch "$GREENLIGHT_REF" https://github.com/iadr-dev/greenlight "$RUNNER_TEMP/greenlight"
      - name: Feature files follow the vocabulary
        run: |
          bdd="$RUNNER_TEMP/greenlight/tools/bdd/bdd"
          "$bdd" lint tests/features
      - name: Gates for every finished feature
        run: |
          bdd="$RUNNER_TEMP/greenlight/tools/bdd/bdd"
          ids=$("$bdd" status --done)   # an assignment: a failing status stops the job instead of looping over nothing
          for id in $ids; do
            "$bdd" approve "$id" --check
            "$bdd" lock "$id" --check --require
            "$bdd" run "$id"
            "$bdd" classify "$id" --expect green
            "$bdd" trace "$id"
            if grep -q '^\[stability\]' .bdd/config.toml; then "$bdd" stability "$id"; fi
            if grep -q '^\[adapters.quality' .bdd/config.toml; then "$bdd" check "$id"; fi
            if grep -q '^\[adapters.mutation\]' .bdd/config.toml; then "$bdd" mutate "$id"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: bdd-runs
          path: .bdd/.runs/
          include-hidden-files: true
