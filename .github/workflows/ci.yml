name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request replaces the run in progress; pushes to main always run to the end.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib unittest)
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -v
      - name: Wrapper smoke test and doctor
        shell: bash
        run: |
          sh tools/bdd/bdd --version
          sh tools/bdd/bdd doctor

  coverage:
    name: coverage (tools/bdd, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Install the pinned, hashed development requirements (wheels only)
        run: uv pip install --system --require-hashes --no-build -r requirements-dev.txt
      - name: Unit tests under coverage
        working-directory: tools/bdd
        run: python -m coverage run -m unittest discover -s tests -t .
      - name: Report the line and branch coverage (the build fails below the target in tools/bdd/.coveragerc)
        working-directory: tools/bdd
        run: |
          python -m coverage report | tee coverage.txt
          { echo "### Coverage of tools/bdd"; echo; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  adapter-python-pytest-bdd:
    name: adapter contract (python-pytest-bdd, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Install the adapter's requirements (pinned, hashed, wheels only)
        run: uv pip install --system --require-hashes --no-build -r requirements-dev.txt
      - name: Fresh scaffold runs green, red looks like red
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_adapter_pytest_bdd.py" -v
      - name: A whole feature in soft mode, without hooks
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_soft_mode_pipeline.py" -v
      - name: bdd init proves the sample feature green
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_initcmd.py" -v
      - name: greenlight's own specs lint clean (dogfood)
        run: sh tools/bdd/bdd lint specs/features
      - name: greenlight's own specs pass (dogfood)
        run: python specs/run_specs.py

  reference-app-legacy-billing:
    name: reference app (legacy-billing, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Install the app's requirements and the test runner's (pinned, hashed, wheels only)
        run: |
          uv pip install --system --require-hashes --no-build -r evals/apps/legacy-billing/requirements.txt
          uv pip install --system --require-hashes --no-build -r requirements-dev.txt
      - name: The app starts and answers
        working-directory: evals/apps/legacy-billing
        run: python smoke.py
      - name: An adoption of it goes through every gate, and the adopt gates refuse what they should
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_adopt_billing.py" -v

  mutation-wrapper:
    name: mutation wrapper (mutmut, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Install mutmut with the adapter's requirements (pinned, hashed, wheels only)
        run: uv pip install --system --require-hashes --no-build -r requirements-mutation.txt
      - name: The wrapper with the real mutmut (weak tests fail the threshold, strong tests pass)
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_mutation_wrapper.py" -v

  adapter-ts-playwright-bdd:
    name: adapter contract (ts-playwright-bdd, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GREENLIGHT_NODE_ADAPTER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: adapters/ts-playwright-bdd/templates/tests/package-lock.json
      - name: Browser system libraries (Linux), from the pinned tooling
        if: runner.os == 'Linux'
        run: |
          npm ci --ignore-scripts --prefix adapters/ts-playwright-bdd/templates/tests --no-audit --no-fund
          sudo node adapters/ts-playwright-bdd/templates/tests/node_modules/@playwright/test/cli.js install-deps chromium
      - name: Fresh scaffold runs green in a browser, every core step works, red looks like red
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_adapter_playwright_bdd.py" -v
      - name: The Stryker wrapper with the real Stryker (weak tests leave survivors, strong tests do not)
        env:
          GREENLIGHT_NODE_MUTATION_TESTS: "1"
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_mutation_wrapper_ts.py" -v

  adapter-go-godog:
    name: adapter contract (go-godog, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GREENLIGHT_GO_ADAPTER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.26"
          cache-dependency-path: adapters/go-godog/templates/tests/go.sum
      - name: Fresh scaffold runs green, every core step works, red looks like red
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_adapter_godog.py" -v
      - name: The shipped templates are gofmt-clean and vet-clean
        shell: bash
        run: |
          go -C adapters/go-godog/templates/tests mod download
          test -z "$(gofmt -l adapters/go-godog/templates/tests)"
          go -C adapters/go-godog/templates/tests vet ./...

  adapter-dotnet-reqnroll:
    name: adapter contract (dotnet-reqnroll, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GREENLIGHT_DOTNET_ADAPTER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: adapters/dotnet-reqnroll/templates/tests/packages.lock.json
      - name: Packages come from the lock file (locked restore, hashed)
        run: dotnet restore adapters/dotnet-reqnroll/templates/tests --locked-mode
      - name: Fresh scaffold runs green, every core step works, red looks like red
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_adapter_reqnroll.py" -v
      - name: The shipped templates are format-clean and build without warnings
        run: |
          dotnet format adapters/dotnet-reqnroll/templates/tests --verify-no-changes --no-restore
          dotnet build adapters/dotnet-reqnroll/templates/tests --no-restore -warnaserror

  adapter-java-cucumber-spring:
    name: adapter contract (java-cucumber-spring, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GREENLIGHT_JVM_ADAPTER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: tools/bdd/tests/fixtures/jvm/spring-contract/pom.xml
      - name: Fresh scaffold runs green under Maven, red looks like red, a scenario with metacharacters runs alone
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_adapter_jvm.py" -k SpringContractTest -v

  adapter-kotlin-android:
    name: adapter contract (kotlin-android, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      GREENLIGHT_JVM_ADAPTER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          gradle-version: "9.8.2"
      - name: Fresh scaffold runs green under Gradle as a Kotlin/JVM module, red looks like red
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_adapter_jvm.py" -k KotlinContractTest -v

  adapter-kotlin-android-agp:
    name: adapter contract (kotlin-android, Android Gradle Plugin)
    runs-on: ubuntu-latest
    env:
      GREENLIGHT_JVM_ADAPTER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          gradle-version: "9.8.2"
      - name: Fresh scaffold runs green as an Android library's local unit test (the SDK is preinstalled on the runner)
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_adapter_jvm.py" -k AndroidContractTest -v

  language-card-rust:
    name: language card commands (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The rustup toolchain of the runner, with rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Every command of the Rust card behaves as the card says
        run: sh evals/language-cards/rust.sh

  language-card-swift:
    name: language card commands (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every command of the Swift card behaves as the card says
        run: sh evals/language-cards/swift.sh

  language-card-kotlin:
    name: language card commands (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          gradle-version: "9.8.2"
      - name: Every command of the Kotlin card behaves as the card says
        run: sh evals/language-cards/kotlin.sh

  reference-app-csv-tool:
    name: reference app (csv-tool, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.23"
          cache: false
      - name: Vet and test the app (standard library only)
        working-directory: evals/apps/csv-tool
        run: |
          go vet ./...
          go test -count=1 ./...

  reference-app-money-lib:
    name: reference app (money-lib, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: evals/apps/money-lib/package-lock.json
      - name: Install from the lockfile and test the app
        working-directory: evals/apps/money-lib
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

  adapter-generic-junit:
    name: adapter contract (generic-junit on the reference apps, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GREENLIGHT_APP_ADAPTER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.23"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - name: Runner reports of cucumber-js, behave, godog, Cucumber-JVM and Reqnroll classify as expected
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_junit_fixtures.py" -v
      - name: A missing seam is a valid red and a working one a valid green, on csv-tool and money-lib
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_adapter_generic_junit_apps.py" -v

  reference-app-shop-web:
    name: reference app (shop-web, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GREENLIGHT_NODE_ADAPTER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Install the Python adapter's requirements (pinned, hashed, wheels only)
        run: uv pip install --system --require-hashes --no-build -r requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            evals/apps/shop-web/package-lock.json
            adapters/ts-playwright-bdd/templates/tests/package-lock.json
      - name: Browser downloads, cached by the pinned tooling
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('adapters/ts-playwright-bdd/templates/tests/package-lock.json') }}
      - name: Browser system libraries (Linux), from the pinned tooling
        if: runner.os == 'Linux'
        run: |
          npm ci --ignore-scripts --prefix adapters/ts-playwright-bdd/templates/tests --no-audit --no-fund
          sudo node adapters/ts-playwright-bdd/templates/tests/node_modules/@playwright/test/cli.js install-deps chromium
      - name: The app builds and its own checks pass
        working-directory: evals/apps/shop-web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
      - name: The adapter works on the real app, and a backend plus the web front end run as one feature
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -p "test_shop_web.py" -v
