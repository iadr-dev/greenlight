name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (stdlib unittest)
        run: python -m unittest discover -s tools/bdd/tests -t tools/bdd -v
      - name: Wrapper smoke test and doctor
        shell: bash
        run: |
          sh tools/bdd/bdd --version
          sh tools/bdd/bdd doctor

  manifests:
    name: plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace and skills (strict)
        run: |
          claude plugin validate . --strict
          claude plugin validate skills --strict
      - name: Validate plugin manifest
        # A root CLAUDE.md (contributor instructions) triggers an informational warning that is
        # expected, so this one is not run with --strict.
        run: claude plugin validate .claude-plugin/plugin.json
